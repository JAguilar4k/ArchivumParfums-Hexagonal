; Pool de PHP-FPM de la API (#21). Corre como el usuario archivum, dueño del código,
; y solo Caddy puede hablarle por el socket.
[archivum]
user = archivum
group = archivum
listen = /run/php/php8.4-fpm-archivum.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Fotos de 2 MB como máximo (#43); se deja margen para el resto del formulario.
php_admin_value[upload_max_filesize] = 4M
php_admin_value[post_max_size] = 8M
php_admin_value[memory_limit] = 256M
php_admin_flag[expose_php] = off
